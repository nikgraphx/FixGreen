name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: |
          xcodebuild \
            -project OpenRightZoom.xcodeproj \
            -scheme OpenRightZoom \
            -configuration Release \
            -destination 'platform=macOS' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
