name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build archive
        run: |
          xcodebuild archive \
            -project OpenRightZoom.xcodeproj \
            -scheme OpenRightZoom \
            -configuration Release \
            -archivePath 'build/Fix Green.xcarchive' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export .app from archive
        run: |
          cp -R 'build/Fix Green.xcarchive/Products/Applications/Fix Green.app' \
                'build/Fix Green.app'

      - name: Ad-hoc sign
        run: |
          codesign --deep --force --sign - 'build/Fix Green.app'

      - name: Zip .app
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent \
            'Fix Green.app' \
            'Fix-Green-${{ github.ref_name }}.zip'

      - name: Prepare release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > build/release-notes.md

      - name: Create draft release and upload app
        uses: softprops/action-gh-release@v3
        with:
          files: build/Fix-Green-${{ github.ref_name }}.zip
          body_path: build/release-notes.md
          draft: true
          generate_release_notes: false

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
