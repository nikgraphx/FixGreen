name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build archive
        run: |
          xcodebuild archive \
            -project OpenRightZoom.xcodeproj \
            -scheme OpenRightZoom \
            -configuration Release \
            -archivePath 'build/Fix Green.xcarchive' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export .app from archive
        run: |
          cp -R 'build/Fix Green.xcarchive/Products/Applications/Fix Green.app' \
                'build/Fix Green.app'

      - name: Ad-hoc sign
        run: |
          codesign --deep --force --sign - 'build/Fix Green.app'

      - name: Zip .app
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent \
            'Fix Green.app' \
            'Fix-Green-${{ github.ref_name }}.zip'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Fix-Green-${{ github.ref_name }}.zip
          generate_release_notes: true
