name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build archive
        run: |
          xcodebuild archive \
            -project OpenRightZoom.xcodeproj \
            -scheme OpenRightZoom \
            -configuration Release \
            -archivePath build/OpenRightZoom.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export .app from archive
        run: |
          cp -r build/OpenRightZoom.xcarchive/Products/Applications/OpenRightZoom.app \
                build/OpenRightZoom.app

      - name: Ad-hoc sign
        run: |
          codesign --deep --force --sign - build/OpenRightZoom.app

      - name: Zip .app
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent \
            OpenRightZoom.app \
            OpenRightZoom-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/OpenRightZoom-${{ github.ref_name }}.zip
          generate_release_notes: true
